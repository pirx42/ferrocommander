# Verifies every commit to `main` and publishes what it built: an Ubuntu
# package, a Windows zip, and a macOS app.
#
# **Deliberately almost empty.** A workflow can only be tested by pushing it —
# no local run, no probe, no green gate — so the logic lives in scripts that
# run on a laptop, and this file installs what they need and calls them.
# Every line here that is not such a call is a line nobody can check before it
# runs for real (`docs/packaging.md`).
name: main

on:
  push:
    branches: [main]
  # So the packaging can be exercised without waiting for a commit.
  workflow_dispatch:

# Read-only except for the one thing this has to do: replace a release. A
# workflow that runs on every commit to the default branch is the most
# attractive thing in the repository to whoever compromises a dependency.
permissions:
  contents: write

concurrency:
  # A second commit while the first is still building makes the first
  # pointless: the release only ever holds the newest build.
  group: main
  cancel-in-progress: true

# TEMPORARY (owner, 2026-08-31): the gate, the Linux packaging and the
# Windows job are removed while the macos job iterates — each of its rounds
# was paying ~16 minutes of green gate to reach a step that fails in
# seconds. Restore by reverting this commit once the macos job is green;
# the macOS package plan's phase 3 tracks it.
jobs:
  macos:
    # After the gate, for the Windows job's reason: the end-to-end suite is
    # X11-only and cannot run here, so the Linux job is the only thing that
    # verifies the commit this package is built from. What this job *is* the
    # first to do is run the program on macOS at all — the smoke test inside
    # the script below is the first-ever start on this OS
    # (`docs/plans/2026-08-31-macos-package.md`).

    # Pinned, and Apple Silicon: macos-15 runners are arm64 Macs, so this is
    # a native build, not a cross one. `latest` moving would swap the OS,
    # Xcode and Homebrew under a bundle whose dylib rewriting is sensitive
    # to all three.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          # `build.rs` and the zip's version both count commits, so a shallow
          # clone would report a build number of one.
          fetch-depth: 0

      - name: GTK4 from Homebrew
        # The platform's MSYS2. coreutils is beside it for one command: the
        # smoke test's gtimeout, which run #23 proved is NOT on the image —
        # stock macOS has no timeout at all, and the script fails with the
        # line this step answers. rustup, otool, install_name_tool and
        # codesign are on the image.
        run: brew install gtk4 coreutils

      - name: Current stable Rust
        # On the image, but stale: run #19 died on "rustc 1.97.1 is not
        # supported" against the workspace's 1.98 rust-version, because
        # rust-toolchain.toml's `stable` resolves to whatever stable is
        # *installed*, and this image's lags the channel. The Linux image
        # tracks it closely and the Windows job installs its toolchain
        # fresh, which is why only this job ever saw the difference.
        run: rustup update stable

      - name: Package
        # Builds, stages the .app, rewrites the Homebrew dylib paths the
        # bundle carries, re-signs what the rewriting unsigned, checks the
        # bundle stands alone, and starts the app to see that it survives
        # its first twenty seconds. All of it in the script, none of it here.
        run: ./scripts/package-macos.sh

      - name: Add it to the rolling build
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLING_TAG: rolling
        # Only an upload, for the Windows job's reason: the release is the
        # `build` job's, so nothing here can leave the README's URL at a 404.
        run: |
          gh release upload "$ROLLING_TAG" \
            target/macos/ferrocommander-macos-arm64.zip --clobber
