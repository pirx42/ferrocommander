[workspace]
members = ["crates/tc-core", "crates/tc-app"]
resolver = "2"

# Shared package metadata: declared once so the two crates cannot drift apart
# on edition or MSRV (skill 17 — centralize constants, applied to manifests).
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/pirx42/ferrocommander"

# Every third-party version is pinned here; member crates reference them with
# `workspace = true`, so a dependency is upgraded in exactly one place.
[workspace.dependencies]
tc-core = { path = "crates/tc-core" }
tempfile = "3"
# How much room is left on a filesystem, which the status line shows. Unix
# only: `statvfs` has no std equivalent, and the alternative is running `df`
# and parsing it — a process per directory step, for a number the kernel will
# hand over in one syscall (docs/performance.md).
libc = "0.2"
# Channels between a job's worker thread and whoever is watching. In tc-core
# rather than tc-app because a channel is not a UI dependency, and because it
# is what lets the shell await the event stream on the GLib main loop without
# tc-core knowing GLib exists. Its blocking and async halves cover both
# directions: the worker waits for a conflict answer, the UI does not wait for
# anything.
async-channel = "2"
# The settings file. A hand-rolled parser would save a dependency and cost
# reliability, which is the wrong way round for a file the program rewrites
# whenever something in it changes (docs/reliability.md). It is read once at
# startup, so the speed requirement is not in tension.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Telling a pane its directory changed under it. inotify on Linux and
# ReadDirectoryChangesW on Windows behind one interface, which is exactly the
# shape of every other platform difference in this project. In tc-core rather
# than tc-app because watching a directory is a filesystem concern and the UI
# does not reach past its own layer (docs/listing.md).
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
# Writing that same file back without destroying it. `toml` serializes a
# struct and reproduces the data and nothing else; the user hand-writes a
# [keys] table with comments into this file, and a save half a second later
# would take them out. `toml_edit` edits the document in place, so everything
# the app does not own survives untouched (docs/config.md).
toml_edit = "0.23"
# Freedesktop / Recycle Bin deletion. Default features are off because they
# pull chrono in for listing and restoring trash contents, which this project
# never does; the Windows COM apartment feature is kept, because dropping it
# would silently change how the crate initializes COM there.
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
# Reading archives as directories (docs/archives.md). `zip` is used as a
# *parser*: default features off, so bzip2, zstd and lzma — three compressors
# with no evidence anybody needs them here, two of which want a C toolchain
# the Windows target does not have — stay out. `deflate` is on because the
# method has to be nameable to be recognised at all, and it costs nothing:
# flate2 is a dependency either way.
#
# The entry bytes are decoded here rather than by the crate, through flate2
# over the raw range the central directory points at. That is what lets
# `open_read` return an owned, streaming decoder instead of something
# borrowing an archive handle behind a mutex — which a VirtualFs handed to a
# worker thread cannot be.
zip = { version = "8", default-features = false, features = ["deflate"] }
# The deflate decoder those readers are built on, and the CRC that checks
# them. Also what a `.tar.gz` is unwrapped with.
flate2 = "1"
# `.tar` and `.tar.gz`. The format looks simple enough that a dependency seems
# unnecessary and is not: long names, the two header dialects, sparse members
# and the checksum are exactly the details a hand-rolled reader gets wrong on
# somebody else's backup.
tar = "0.4"
# The GTK4 bindings, pinned to the GTK 4.12 API.
#
# The floor was 4.0 on the assumption that the shell needed nothing newer.
# That was wrong: scrolling the cursor row into view has no supported
# baseline API — gtk_column_view_scroll_to arrived in 4.12, and the
# list.scroll-to-item action lives on an internal widget, not on ColumnView.
# 4.12 is from March 2024; the cost is Debian 12 (4.8) and Ubuntu 22.04 (4.6).
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
