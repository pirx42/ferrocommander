[workspace]
members = ["crates/tc-core", "crates/tc-app"]
resolver = "2"

# Shared package metadata: declared once so the two crates cannot drift apart
# on edition or MSRV (skill 17 — centralize constants, applied to manifests).
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/pirx/ferrocommander"

# Every third-party version is pinned here; member crates reference them with
# `workspace = true`, so a dependency is upgraded in exactly one place.
[workspace.dependencies]
tc-core = { path = "crates/tc-core" }
tempfile = "3"
# The GTK4 bindings, pinned to the GTK 4.12 API.
#
# The floor was 4.0 on the assumption that the shell needed nothing newer.
# That was wrong: scrolling the cursor row into view has no supported
# baseline API — gtk_column_view_scroll_to arrived in 4.12, and the
# list.scroll-to-item action lives on an internal widget, not on ColumnView.
# 4.12 is from March 2024; the cost is Debian 12 (4.8) and Ubuntu 22.04 (4.6).
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
