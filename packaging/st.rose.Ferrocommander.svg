<?xml version="1.0" encoding="UTF-8"?>
<!--
  The application icon: two panes side by side, which is the whole idea of
  the program and the first thing anybody sees of it.

  Drawn here rather than borrowed. It will not win anything; it is ours, it
  is scalable, it says "two lists of files", and it can be replaced by
  somebody who draws better without touching anything else.

  Rust-orange for the ferro-, one pane brighter than the other because one
  pane always has the keyboard.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect x="2" y="6" width="60" height="52" rx="6" fill="#2b2b2f"/>
  <rect x="2" y="6" width="60" height="52" rx="6" fill="none" stroke="#b7410e" stroke-width="2"/>

  <!-- The active pane: brighter, and outlined the way a focused pane is. -->
  <rect x="7" y="13" width="24" height="38" rx="2" fill="#3a3a40"/>
  <rect x="7" y="13" width="24" height="38" rx="2" fill="none" stroke="#e2703a" stroke-width="1.5"/>
  <!-- The cursor row. -->
  <rect x="9" y="19" width="20" height="4" rx="1" fill="#e2703a"/>
  <rect x="9" y="26" width="20" height="2.5" rx="1" fill="#8d8d96"/>
  <rect x="9" y="32" width="16" height="2.5" rx="1" fill="#8d8d96"/>
  <rect x="9" y="38" width="18" height="2.5" rx="1" fill="#8d8d96"/>
  <rect x="9" y="44" width="13" height="2.5" rx="1" fill="#8d8d96"/>

  <!-- The other pane: the same list, dimmer, because only one has focus. -->
  <rect x="33" y="13" width="24" height="38" rx="2" fill="#2f2f34"/>
  <rect x="35" y="19" width="20" height="2.5" rx="1" fill="#6a6a72"/>
  <rect x="35" y="26" width="14" height="2.5" rx="1" fill="#6a6a72"/>
  <rect x="35" y="32" width="18" height="2.5" rx="1" fill="#6a6a72"/>
  <rect x="35" y="38" width="11" height="2.5" rx="1" fill="#6a6a72"/>
  <rect x="35" y="44" width="16" height="2.5" rx="1" fill="#6a6a72"/>
</svg>
